name: Candidatas de anime 2

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/anime-candidates2.yml'
      - 'scripts/anime-candidates2-probe.mjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Medir candidatas de anime
        run: node scripts/anime-candidates2-probe.mjs
      - name: Devolver el resultado a la rama
        if: always()
        run: |
          test -s .probe/anime-candidates2.md || exit 0
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add -f .probe/anime-candidates2.md
          git diff --cached --quiet || git commit -m "sonda: candidatas de anime 2 $(date -u +%FT%TZ) [skip ci]"
          git fetch origin || true
          git rebase -X theirs origin/${{ github.ref_name }} || git rebase --abort || true
          git push origin HEAD:refs/heads/${{ github.ref_name }} || true
