name: Build StreamFlix Mobile Plugin APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android/**'
      - '.github/workflows/build-mobile-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mobile-apk:
    name: Test & Build Mobile APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Configure local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: |
          {
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "SUBDL_API_KEY=${SUBDL_API_KEY}"
          } > local.properties

      - name: Generate signing key for installable release APK
        run: |
          mkdir -p ci-signing
          keytool -genkeypair -v \
            -keystore ci-signing/release.keystore \
            -storepass streamflix -keypass streamflix \
            -alias streamflix -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=StreamFlix Mobile, OU=Plugins, O=StreamFlix, L=Managua, C=NI"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests (QuickJS plugin runtime & manifest parser)
        run: |
          set -o pipefail
          if ! ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee gradle-test.log; then
            python3 - <<'PY'
          import pathlib
          log = pathlib.Path("gradle-test.log").read_text(errors="replace").splitlines()
          interesting = [l for l in log if any(k in l for k in ("e: ", "FAILURE:", "FAILED", "Exception", "Error", "AssertionError", "Caused by:", "* What went wrong:"))]
          snippet = "\n".join((interesting[-40:] if interesting else []) + ["--- TAIL ---"] + log[-45:])
          encoded = snippet.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=GradleTestFailure::{encoded[:3800]}")
          PY
            # Also dump XML test reports if tests ran and failed
            python3 - <<'PY'
          import pathlib
          for p in sorted(pathlib.Path("app/build/test-results").rglob("*.xml")):
              txt = p.read_text(errors="replace")
              if "<failure" in txt or "<error" in txt:
                  enc = txt[:3500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=TestReport-{p.name}::{enc}")
          PY
            exit 1
          fi

      - name: Assemble Mobile Debug & Release APKs
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon 2>&1 | tee gradle-assemble.log; then
            python3 - <<'PY'
          import pathlib
          log = pathlib.Path("gradle-assemble.log").read_text(errors="replace").splitlines()
          interesting = [l for l in log if any(k in l for k in ("e: ", "FAILURE:", "FAILED", "Exception", "Error", "Caused by:", "* What went wrong:"))]
          snippet = "\n".join((interesting[-40:] if interesting else []) + ["--- TAIL ---"] + log[-45:])
          encoded = snippet.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=GradleAssembleFailure::{encoded[:3800]}")
          PY
            exit 1
          fi

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/streamflix-mobile-plugins-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/streamflix-mobile-plugins-release.apk
          ls -lh out/

      - name: Upload Mobile APKs
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-mobile-plugins-apks
          path: android/out/*.apk
          if-no-files-found: error
