name: FlixLatam y Cuevana 3 en vivo
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/flixlatam-cuevana.yml'
      - 'lib/flixlatam*.js'
      - 'lib/cuevana3*.js'
      - 'lib/spanishProviders.js'
      - 'lib/streamChoices.js'
      - 'scripts/flixlatam-cuevana-live.js'
      - 'scripts/providers-live.js'
      - 'test/flixlatam*.test.js'
      - 'test/cuevana3*.test.js'
      - 'test/spanishProviders.test.js'
      - 'test/streamChoices.test.js'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regresiones locales y registro activo
        run: node --test test/flixlatam.test.js test/cuevana3.test.js test/spanishProviders.test.js test/streamChoices.test.js
      - name: FlixLatam (sonda informativa)
        run: node scripts/flixlatam-cuevana-live.js flixlatam
      - name: Cuevana 3 (sonda informativa)
        run: node scripts/flixlatam-cuevana-live.js cuevana3
