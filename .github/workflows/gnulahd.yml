name: GnulaHD en vivo
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/gnulahd.yml'
      - 'lib/gnulahd.js'
      - 'lib/streams.js'
      - 'scripts/gnulahd-*.js'
      - 'test/gnulahd*.test.js'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test test/gnulahd*.test.js test/streamChoices.test.js
      - name: Adaptador por defecto contra fichas y episodios (sonda informativa)
        run: node scripts/gnulahd-live.js adapter
