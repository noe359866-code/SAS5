name: GnulaHD en vivo
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/gnulahd.yml'
      - 'scripts/gnulahd-*.js'
      - 'test/gnulahdLive.test.js'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test test/gnulahdLive.test.js
      - name: Fichas públicas y episodios (sonda informativa)
        run: node scripts/gnulahd-live.js
