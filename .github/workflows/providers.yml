name: Proveedores (sonda real)

# Comprueba contra los servicios reales que los proveedores en español siguen
# respondiendo y que sus URLs no han cambiado. Los runners de GitHub sí llegan
# a embed69.org, cuevana, knaben, etc., así que esto es la única prueba "de
# verdad" de extremo a extremo: no usa dobles ni datos de ejemplo.
#
# No necesita secretos. Todo lo que imprime son conteos y nombres de release,
# nunca claves: el passkey de UIndex, si algún día se usa, va como secreto.

on:
  workflow_dispatch:
    inputs:
      imdb:
        description: 'IMDb de la película de prueba'
        required: false
        default: 'tt0816692'
      series:
        description: 'IMDb de la serie de prueba'
        required: false
        default: 'tt0903747'
      movie:
        description: 'TMDB de la película de prueba (vacío = Interstellar)'
        required: false
        default: ''
      provider_url:
        description: 'URL desplegada para probar /stream (opcional)'
        required: false
        default: ''
  push:
    paths:
      - 'lib/streams.js'
      - 'lib/spinflix.js'
      - 'lib/embed69.js'
      - 'lib/videoapi.js'
      - 'scripts/sources-probe.mjs'
      - 'lib/hlsProxy.js'
      - 'scripts/providers-check.mjs'
      - 'scripts/embed69-pow.mjs'
      - '.github/workflows/providers.yml'
  schedule:
    # Una vez al día: detecta dominios caídos o cambios de formato sin que
    # nadie tenga que acordarse de lanzarlo.
    - cron: '41 6 * * *'

concurrency:
  group: providers-check
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Tests offline
        run: npm test

      # Informe de las tres fuentes hispanas + indexadores. `continue-on-error`
      # porque una caída puntual de un tercero no debe poner rojo el repo: el
      # resumen del job dice qué falló exactamente.
      - name: Sonda de proveedores (película y serie)
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CHECK_TIMEOUT_MS: '15000'
          MOVIE_IMDB: ${{ inputs.imdb || 'tt0816692' }}
          SERIES_IMDB: ${{ inputs.series || 'tt0903747' }}
        run: |
          set -o pipefail
          echo "### Película (${MOVIE_IMDB})" >> "$GITHUB_STEP_SUMMARY"
          node scripts/providers-check.mjs --imdb "$MOVIE_IMDB" | tee /tmp/movie.txt
          {
            echo '```'
            cat /tmp/movie.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "### Serie (${SERIES_IMDB})" >> "$GITHUB_STEP_SUMMARY"
          node scripts/providers-check.mjs --series "$SERIES_IMDB" | tee /tmp/series.txt
          {
            echo '```'
            cat /tmp/series.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Embed69 necesita resolver el PoW: aquí (runner, sin límite de CPU) se
      # comprueba que el algoritmo sigue siendo el mismo y, si sale, se deja el
      # valor listo para usar como EMBED69_POW.
      - name: Embed69 · PoW y enlaces
        continue-on-error: true
        env:
          EMBED69_IMDB: ${{ inputs.imdb || 'tt0816692' }}
        run: |
          set -o pipefail
          node scripts/embed69-pow.mjs --imdb "$EMBED69_IMDB" | tee /tmp/pow.txt
          {
            echo '### Embed69 · PoW'
            echo '```'
            cat /tmp/pow.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # VideoAPI no tiene PoW: si esto falla es que cambiaron el contrato de
      # /exists o el reproductor dejó de devolver el iframe. Este paso va
      # ESTRICTO (sin continue-on-error) a propósito: su color es la respuesta
      # legible cuando los logs no se pueden leer desde fuera.
      - name: VideoAPI · catálogo y reproductor
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VIDEOAPI_MOVIE: ${{ inputs.movie }}
          VIDEOAPI_IMDB: ${{ inputs.imdb || 'tt0816692' }}
        run: |
          set -o pipefail
          # El motivo se publica como anotación: es lo único del run que se
          # puede leer por la API cuando los logs devuelven EOF.
          # Sin TMDB_API_KEY la sonda va por TMDB id y sigue valiendo: mide
          # VideoAPI, no la configuración del entorno.
          args="--imdb $VIDEOAPI_IMDB"
          if [ -n "$VIDEOAPI_MOVIE" ]; then args="--movie $VIDEOAPI_MOVIE $args"; fi
          if node scripts/videoapi-check.mjs $args > /tmp/videoapi.txt 2>&1; then
            status=0
          else
            status=$?
          fi
          cat /tmp/videoapi.txt
          if [ "$status" -ne 0 ]; then
            reason="$(grep -v '^$' /tmp/videoapi.txt | grep -vE '^VideoAPI ·' | tail -4 | tr '\n' '|')"
            echo "::error title=VideoAPI (código $status)::$reason"
          fi
          {
            echo '### VideoAPI'
            echo '```'
            cat /tmp/videoapi.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Webs candidatas: se mira el HTML crudo para ver si el reproductor es
      # propio o son embeds de terceros. Es la decisión que separa «merece un
      # proveedor» de «esto ya lo cubre Embed69». El resumen se publica como
      # anotación porque los logs no se pueden leer desde fuera del repo.
      - name: Fuentes candidatas (HTML crudo)
        continue-on-error: true
        run: |
          set -o pipefail
          urls="https://flixlatam.com/pelicula/interstellar
          https://flixlatam.com/serie/la-mesa-final-r5gv9C
          https://doramasflix.in/episodios/doctor-x-mafia-in-white-1x12
          https://doramasflix.co/capitulos/doctor-x-mafia-in-white-1x12"
          {
            echo '### Fuentes candidatas'
            echo '```'
            node scripts/sources-probe.mjs $urls || true
            node scripts/sources-probe.mjs --gql || true
            echo '```'
            echo '### Doramasflix · qué hay en `servidores`'
            node scripts/sources-probe.mjs --dump https://doramasflix.in/episodios/doctor-x-mafia-in-white-1x12 > /tmp/dump.txt 2>&1 || true
            cat /tmp/dump.txt
          } | tee /tmp/fuentes.txt
          cat /tmp/fuentes.txt >> "$GITHUB_STEP_SUMMARY"
          # Anotación: una línea por fuente, sin los ejemplos de URL.
          while IFS= read -r l; do
            case "$l" in
              *http*) echo "::notice title=Fuentes candidatas::$l" ;;
            esac
          done < /tmp/fuentes.txt
          # Lo único que decide es qué hosts sirve el payload: se emite solo eso.
          hosts_line="$(grep -m1 'hosts en el payload' /tmp/dump.txt || true)"
          [ -n "$hosts_line" ] && echo "::notice title=Doramasflix hosts::$hosts_line"

      # Los informes también como artefacto: los logs y el resumen de Actions
      # no siempre se pueden leer desde fuera del repo, el artefacto sí.
      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proveedores-informe
          path: |
            /tmp/movie.txt
            /tmp/series.txt
            /tmp/pow.txt
            /tmp/videoapi.txt
            /tmp/fuentes.txt
            /tmp/dump.txt
            /tmp/e2e.txt
          if-no-files-found: warn
          retention-days: 14

      # End-to-end opcional: si se indica la URL del despliegue, se pide un
      # /stream real y se cuentan los resultados por proveedor.
      - name: End-to-end contra el despliegue
        if: ${{ inputs.provider_url != '' }}
        env:
          ADDON_URL: ${{ inputs.provider_url }}
          MOVIE_IMDB: ${{ inputs.imdb || 'tt0816692' }}
        run: node scripts/providers-e2e.mjs --url "$ADDON_URL" --imdb "$MOVIE_IMDB" | tee /tmp/e2e.txt
