name: Tests
on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/providers.yml'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
  live:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    env:
      STREAM_PROVIDERS: fanpelis,playlatin,flixlatam,cuevana3,cinecalidad,tioplus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/providers-live.js
