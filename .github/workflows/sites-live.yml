name: Adaptadores de sitios en vivo
on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Adaptadores (cuevanas3 animeflv fuegocine pelisjuanita); vacío = todos'
        required: false
        default: ''
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/sites-live.yml'
      - 'scripts/sites-live.js'
      - 'lib/sites/**'
      - 'lib/extractors.js'
      - 'lib/mediaParse.js'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pruebas de los adaptadores (sin red)
        run: node --test test/siteExtractors.test.js test/mediaParse.test.js
      - name: Adaptadores contra los sitios reales
        run: node scripts/sites-live.js ${{ inputs.providers }}
      - name: Alcance de episodios (One Piece hasta el último cap)
        run: node scripts/anime-reach-probe.mjs || true
      - name: Buscador crudo de películas (títulos que no aparecen)
        run: node scripts/movies-reach-probe.mjs || true
      - name: Devolver resultados a la rama
        if: always()
        run: |
          test -s .probe/sites-live.json || exit 0
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          # Solo el resumen (tabla y JSON): los volcados de `.probe/html` son
          # material de diagnóstico y no tienen por qué viajar en el PR. `-f`
          # porque `.probe/` está en .gitignore; el push va por refspec
          # explícita para que funcione también con el checkout en HEAD separado.
          git add -f .probe/sites-live.md .probe/anime-reach.md .probe/movies-reach.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "sonda: adaptadores de sitios $(date -u +%FT%TZ) [skip ci]"
          # La sonda de descubrimiento empuja cada pocos minutos: sin rebasar,
          # el push de este job se rechazaba en silencio y el resumen se perdía.
          git fetch origin || true
          git rebase -X theirs origin/${{ github.ref_name }} || git rebase --abort || true
          git push origin HEAD:refs/heads/${{ github.ref_name }} || true
