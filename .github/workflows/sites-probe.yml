name: Sitios en vivo (sonda de descubrimiento)
on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sitios separados por espacio (gnulaone ultra tubeonline mirando)'
        required: false
        default: ''
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/sites-probe.yml'
      - 'scripts/sites-probe.mjs'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Descubrimiento (informativo, no despliega)
        run: node scripts/sites-probe.mjs ${{ inputs.sites }}
      - name: Devolver resultados a la rama
        if: always()
        run: |
          test -s .probe/sites-probe.json || exit 0
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          git add -f .probe/sites-probe.json .probe/sites-probe.md
          git commit -m "sonda: resultados de $(date -u +%FT%TZ) [skip ci]"
          git push
