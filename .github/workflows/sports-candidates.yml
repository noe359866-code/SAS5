name: Candidatas de canales deportivos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/sports-candidates.yml'
      - 'scripts/sports-candidates-probe.mjs'
      - 'scripts/sports-players-probe.mjs'
      - 'scripts/sports-decode-probe.mjs'
      - 'scripts/sports-chain-probe.mjs'
      - 'scripts/sports-lists-probe.mjs'
      - 'scripts/live-lists-probe.mjs'
      - 'scripts/tvclub-source-probe.mjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Medir webs de canales deportivos
        run: node scripts/sports-candidates-probe.mjs
      - name: Cadena del reproductor de canales
        if: always()
        run: test -f scripts/sports-players-probe.mjs && node scripts/sports-players-probe.mjs || echo "sin sonda de reproductores todavía"
      - name: Decodificar reproductores
        if: always()
        run: test -f scripts/sports-decode-probe.mjs && node scripts/sports-decode-probe.mjs || echo "sin sonda de decodificación todavía"
      - name: Cadena completa de streamtp
        if: always()
        run: test -f scripts/sports-chain-probe.mjs && node scripts/sports-chain-probe.mjs || echo "sin sonda de cadena todavía"
      - name: Listas públicas de canales deportivos
        if: always()
        run: test -f scripts/sports-lists-probe.mjs && node scripts/sports-lists-probe.mjs || echo "sin sonda de listas todavía"
      - name: Listas de canales por categorías (Magma TV + IPTVSV)
        run: test -f scripts/live-lists-probe.mjs && node scripts/live-lists-probe.mjs || echo "sin sonda de categorías todavía"
      - name: Fuente tvcluboficial a fondo
        run: test -f scripts/tvclub-source-probe.mjs && node scripts/tvclub-source-probe.mjs || echo "sin sonda tvclub todavía"
      - name: Actualizar la semilla de canales del addon (con guarda)
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const fresh = JSON.parse(fs.readFileSync('.probe/live-channels.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('lib/data/liveChannelsSeed.json', 'utf8'));
          const floor = Math.floor(current.length * 0.8);
          if (fresh.length >= floor) {
            fs.writeFileSync('lib/data/liveChannelsSeed.json', JSON.stringify(fresh, null, 1) + '\n');
            console.log('semilla actualizada:', current.length, '->', fresh.length);
          } else {
            console.log('semilla NO actualizada: la sonda trajo', fresh.length, '< 80% de', current.length, '(posible mal día de red)');
          }
          "
      # OJO: el `[skip ci]` protege este workflow de re-dispararse, pero GitHub
      # lo arrastra al cuerpo de los squash-merge y Cloudflare Workers Builds
      # saltaría el despliegue de producción. Al fusionar un PR que incluya
      # estos commits, pasa un asunto limpio: gh pr merge N --squash --subject "…"
      # OJO: la marca skip-ci protege este workflow de re-dispararse, pero GitHub
      # la arrastra al cuerpo de los squash-merge y Cloudflare Workers Builds
      # saltaría el despliegue de producción. Al fusionar un PR que incluya
      # estos commits, el asunto y el cuerpo del merge NO pueden contener la
      # marca literal (ni siquiera mencionada): gh pr merge N --squash --subject "…"
      # Confirmado dos veces el 24-11-2026 (builds de main saltados en #48 y #49).
      - name: Devolver el resultado a la rama
        if: always()
        run: |
          test -s .probe/sports-candidates.md || exit 0
          git config user.name "sonda"
          git config user.email "sonda@users.noreply.github.com"
          for f in .probe/sports-candidates.md .probe/sports-players.md .probe/sports-decode.md .probe/sports-chain.md .probe/sports-lists.md .probe/sports-logos.tsv .probe/live-lists.md .probe/live-channels.json .probe/tvclub-source.md lib/data/liveChannelsSeed.json; do
            test -s "$f" && git add -f "$f"
          done
          git diff --cached --quiet || git commit -m "sonda: candidatas de canales deportivos $(date -u +%FT%TZ) [skip ci]"
          git fetch origin || true
          git rebase -X theirs origin/${{ github.ref_name }} || git rebase --abort || true
          git push origin HEAD:refs/heads/${{ github.ref_name }} || true
