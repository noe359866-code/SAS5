name: Candidatos de StreamFlix (Node)
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/streamflix-candidates.yml'
      - 'scripts/streamflix-*.js'
      - 'node/streamflix*.js'
      - 'api/index.js'
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/streamflix-candidates.js
      - run: node scripts/streamflix-live.js
