name: Sonda videoapi.la
on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/videoapi-probe.yml'
      - 'scripts/videoapi-probe.mjs'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ejecutar sonda videoapi.la
        run: node scripts/videoapi-probe.mjs
      - name: Guardar resultado en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .probe/videoapi.md
          git diff --cached --quiet || git commit -m "probe: resultado videoapi.la"
          git push
