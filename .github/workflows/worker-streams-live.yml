name: Streams del Worker y CDN directo
on:
  workflow_dispatch:
  push:
    branches: ['arena/**', 'main']
    paths:
      - '.github/workflows/worker-streams-live.yml'
      - 'scripts/worker-streams-live.js'
      - 'test/workerStreamsLive.test.js'
      - 'lib/config.js'
      - 'lib/directMedia.js'
      - 'lib/fanpelis.js'
      - 'lib/spinflix.js'
      - 'lib/providerHttp.js'
      - 'lib/providerTitles.js'
      - 'lib/hlsManifest.js'
      - 'lib/streams.js'
      - 'lib/vimeos.js'
      - 'worker.mjs'
permissions:
  contents: read
jobs:
  probe:
    # Las pruebas de rama no gastan invocaciones del Worker publicado.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test test/workerStreamsLive.test.js
      - name: API publicada y manifiestos del CDN (sin seguir proxies de versiones anteriores)
        run: node scripts/worker-streams-live.js
      - name: Primeros segmentos del CDN desde los enlaces de producción
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/worker-streams-live.js --playback
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: API de workerd local y primeros segmentos directos del CDN
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8799 --var STREAM_PROVIDERS:fanpelis,spinflix > "$RUNNER_TEMP/playback-worker.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8799/healthz -o "$RUNNER_TEMP/playback-ready.json"; then break; fi
            sleep 1
          done
          if ! test -s "$RUNNER_TEMP/playback-ready.json"; then cat "$RUNNER_TEMP/playback-worker.log"; exit 1; fi
          node scripts/worker-streams-live.js --playback http://127.0.0.1:8799 --expect-direct
