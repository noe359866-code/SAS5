<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://vimeos.net/embed-ccjygcfxujhd.html" 
    allow="accelerometer; autoplay; camera; clipboard-read; clipboard-write; display-capture; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment; usb; vr; xr-spatial-tracking; picture-in-picture; gamepad; *"
    allowfullscreen
    referrerpolicy="unsafe-url"
  ></iframe>
      <script type="text/javascript" async>
        (function () {
        	const domain = "cuevana.gs";
        	const adAngleOverrollHost = "";
        	const adAngleOverrollSelector = "body";
        	const adAngleOverrollLang = "en";
        	const libJS = "https://cvt-s2.agl003.com/o/f/lib.js";
        	const cpHOST = `bb597b77de7440619f0e27524573ad12%7C${domain}`;
        	const vastURL =
        		"https://cvt-s2.agl003.com/v/_jMvMjk5MDQ4ZTUtO-EzNSWWYzYxL-EyZDUtNGNmM2IWNmE1NTBl.xml";
        	function buildIframeHTML(config, adConfig) {
        		const doc = document.implementation.createHTMLDocument("");
        		const meta = doc.createElement("meta");
        		meta.setAttribute("charset", "utf-8");
        		doc.head.appendChild(meta);
        		const style = doc.createElement("style");
        		style.textContent = `
                    html, body { margin:0; width:100%; height:100%; font-family: arial; }
                    #${config.CONTAINER_ID} { width:100vw; height:100vh; display:block; position:fixed; }
                `;
        		doc.head.appendChild(style);
        		const container = doc.createElement("div");
        		container.id = config.CONTAINER_ID;
        		doc.body.appendChild(container);
        		const scriptLib = doc.createElement("script");
        		scriptLib.src = config.AD_SCRIPT_URL;
        		doc.body.appendChild(scriptLib);
        		const scriptInit = doc.createElement("script");
        		scriptInit.textContent = `
                    window.onload = () => {
                    try {
                        if (typeof adAngleOverRollAds === 'function') {
                            adAngleOverRollAds({
                                rek: { preroll: ${JSON.stringify(adConfig.vstUrls)} },
                                selector: '#${config.CONTAINER_ID}',
                                host: '${config.HOST}',
                                lang: '${config.LANGUAGE}',
                                cp: ${JSON.stringify(adConfig.cpParams)}
                            });
                        } else {
                            window.parent.postMessage({ event: 'remove_overroll_iframe' }, '*');
                        }
                    } catch (e) {
                        window.parent.postMessage({ event: 'remove_overroll_iframe' }, '*');
                    }
                    };
                `;
        		doc.body.appendChild(scriptInit);
        		return "<!doctype html>" + doc.documentElement.outerHTML;
        	}
        
        	function InitOverroll() {
        		let overlayDiv, overlayIframe, container;
        		let started = false;
        		function applyStyles(el, styles = {}) {
        			if (!el) return;
        			Object.entries(styles).forEach(([prop, value]) => {
        				el.style[prop] = value;
        			});
        		}
        		function createElement(tag, onClick) {
        			const el = document.createElement(tag);
        			applyStyles(el, { cursor: "pointer", display: "block" });
        			if (onClick) el.addEventListener("click", onClick);
        			return el;
        		}
        		overlayDiv = createElement("div", () => {
        			if (!started) {
        				started = true;
        				applyStyles(overlayIframe, { display: "block", opacity: 1 });
        				overlayIframe.contentWindow.postMessage(
        					{ event: "start_preroll", status: true },
        					"*"
        				);
        			}
        		});
        		overlayIframe = createElement("iframe");
        		applyStyles(overlayIframe, {
        			display: "block",
        			width: "100%",
        			height: "100%",
        			border: "none",
        			top: 0,
        			opacity: 0,
        		});
        		const html = buildIframeHTML(
        			{
        				CONTAINER_ID: "video-container",
        				AD_SCRIPT_URL: libJS,
        				HOST: adAngleOverrollHost,
        				LANGUAGE: adAngleOverrollLang,
        			},
        			{
        				vstUrls: [vastURL],
        				cpParams: [
        					["cp.domain", domain],
        					["cp.host", cpHOST],
        				],
        			}
        		);
        		if ("srcdoc" in overlayIframe) {
        			overlayIframe.srcdoc = html;
        		} else {
        			overlayIframe.src = "about:blank";
        			const idoc =
        				overlayIframe.contentDocument ||
        				overlayIframe.contentWindow.document;
        			idoc.open();
        			idoc.write(html);
        			idoc.close();
        		}
        		overlayDiv.appendChild(overlayIframe);
        		window.addEventListener("message", (event) => {
        			const data = event.data;
        			if (typeof data === "object") {
        				if (data.event === "remove_overroll_iframe") {
        					overlayDiv.remove();
        					if (typeof AdAngleEndEvent === "function")
        						AdAngleEndEvent();
        				}
        				if (data.event === "start_preroll") {
        					overlayIframe.style.display = "block";
        					overlayIframe.style.opacity = 1;
        					window.unLockCurrentPlayer();
        				}
        			}
        		});
        		applyStyles(overlayDiv, {
        			width: "100%",
        			height: "100%",
        			position: "absolute",
        			top: 0,
        			zIndex: 99,
        		});
        		const intervalId = setInterval(() => {
        			container = document.querySelector(adAngleOverrollSelector);
        			if (container && container.querySelector("iframe")) {
        				container.insertBefore(
        					overlayDiv,
        					container.firstChild?.nextSibling || null
        				);
        				clearInterval(intervalId);
        			}
        		}, 100);
        	}
        	InitOverroll();
        })(window);
    </script>
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"3289eb5654b841e4ac63897c7325cd79","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
