    <style>
        html,

            margin: 0;

        #container {
            position: absolute;
            text-align: center;

        .ribbon-1 {
            position: fixed;
            background: #edb709;
            box-shadow: 0 0 0 999px #edb709;
            clip-path: inset(0 -100%);
            font-size: 20px;
        }

        .left {
            inset: 0 auto auto 0;
            transform-origin: 100% 0;
            transform: translate(-29.3%) rotate(-45deg);
        }

        .right {
            inset: 0 0 auto auto;
            transform-origin: 0 0;
            transform: translate(29.3%) rotate(45deg);
        }
    </style>
    <style>
        #videoContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #videoPlayer {
            display: block;
            z-index: 1001;
            width: 100%;
            height: 100%;
        }

        #skipCountdown {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            color: #fff;
            display: none;
            z-index: 1003;
            cursor: pointer;
        }

        #goToAdLink {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            color: #fff;
            display: none;
            z-index: 1002;
            cursor: pointer;
        }

        #modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.9);
        }

        #modal-content {
            margin: auto;
            display: block;
            width: 80%;
            height: 80%;
            padding: 20px;
        }

        .floating-banner {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%) translateY(20px);
            width: min(95%, 900px);
            background: linear-gradient(135deg, #111, #2b2b2b);
            color: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s ease;
        }

        .floating-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .banner-image {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .banner-content {
            flex: 1;
        }

        .banner-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .banner-text {
            font-size: 14px;
            color: #d8d8d8;
            margin: 0;
        }

        .banner-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .banner-btn {
            background: #ffcc00;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .banner-btn:hover {
            transform: translateY(-2px);
        }

        .banner-close {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .banner-close:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 640px) {
            .floating-banner {
                flex-direction: column;
                align-items: stretch;
            }

            .banner-image {
                width: 100%;
                height: 140px;
            }

            .banner-actions {
                justify-content: space-between;
            }

            .banner-btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
