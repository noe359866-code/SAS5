plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def quickJsVersion = '1.0.0-alpha13'

android {
    namespace 'com.streamflixreborn.streamflix'
    compileSdk 36

    def properties = new Properties()
    def localPropsFile = project.rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { properties.load(it) }
    }

    def tmdbKey = (properties.getProperty("TMDB_API_KEY") ?: System.getenv("TMDB_API_KEY") ?: "").trim()
    def subdlKey = (properties.getProperty("SUBDL_API_KEY") ?: System.getenv("SUBDL_API_KEY") ?: "").trim()

    defaultConfig {
        applicationId "com.streamflixreborn.streamflix"
        minSdk 21
        targetSdk 35
        versionCode 147
        versionName "1.1.0-mobile-plugins"

        buildConfigField "String", "APP_LAYOUT", "\"mobile\""
        buildConfigField "String", "TMDB_API_KEY", "\"${tmdbKey}\""
        buildConfigField "String", "SUBDL_API_KEY", "\"${subdlKey}\""
    }

    sourceSets {
        main {
            manifest.srcFile "${project.rootDir}/app/src/main/AndroidManifest.xml"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Ephemeral or custom CI keystore so release APKs are signed and installable on mobile
    def ciKeystore = rootProject.file("ci-signing/release.keystore")
    signingConfigs {
        if (ciKeystore.exists()) {
            ciRelease {
                storeFile ciKeystore
                storePassword System.getenv("CI_KEYSTORE_PASSWORD") ?: "streamflix"
                keyAlias System.getenv("CI_KEY_ALIAS") ?: "streamflix"
                keyPassword System.getenv("CI_KEY_PASSWORD") ?: "streamflix"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ciKeystore.exists()) {
                signingConfig signingConfigs.ciRelease
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        jniLibs {
            keepDebugSymbols += "**/libquickjs.so"
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/INDEX.LIST",
            ]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Substitute Android QuickJS JNI artifact with JVM JNI artifact when running local JVM unit tests
configurations.matching { it.name.endsWith("UnitTestRuntimeClasspath") }.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute(module("io.github.dokar3:quickjs-kt-android"))
            .using(module("io.github.dokar3:quickjs-kt-jvm:${quickJsVersion}"))
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.8'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.github.bumptech.glide:glide:5.0.0-rc01'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    ksp 'com.github.bumptech.glide:ksp:5.0.0-rc01'
    implementation 'com.github.bumptech.glide:okhttp3-integration:5.0.0-rc01'

    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'dnsjava:dnsjava:3.6.3'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'

    // External Nuvio-compatible JS plugin engine (QuickJS + Jsoup + CryptoJS)
    implementation "io.github.dokar3:quickjs-kt:${quickJsVersion}"
    implementation 'org.webjars.npm:crypto-js:4.2.0'
    implementation 'org.jsoup:jsoup:1.19.1'

    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation "androidx.room:room-runtime:2.7.0-rc01"
    implementation "androidx.room:room-ktx:2.7.0-rc01"
    implementation 'com.google.android.material:material:1.12.0'
    ksp 'androidx.room:room-compiler:2.7.0-rc01'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'androidx.browser:browser:1.7.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
}

ksp {
    arg("com.bumptech.glide.GlideModule", "AppGlideModule")
}
