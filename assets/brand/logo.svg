<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">RamdonLatam</title>
  <!--
    Marca RamdonLatam: una baraja de tres fichas abanicadas —el «ramdon» de
    títulos que se barajan— con un botón de reproducción en la ficha de
    delante. Azul noche para el fondo y naranja del logo original para las
    fichas. Todo son formas planas con degradado: escala a cualquier tamaño.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2=".42" y2="1">
      <stop offset="0" stop-color="#123a5c"/><stop offset=".5" stop-color="#0a2033"/><stop offset="1" stop-color="#050f1a"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#b34c08"/><stop offset="1" stop-color="#8f3a05"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#e06d12"/><stop offset="1" stop-color="#c0520a"/>
    </linearGradient>
    <linearGradient id="cardFront" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#ffb257"/><stop offset=".52" stop-color="#f5821f"/><stop offset="1" stop-color="#e05f0b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <g transform="rotate(-26 256 300)"><rect x="140" y="123" width="232" height="254" rx="54" fill="url(#cardBack)"/></g>
  <g transform="rotate(-13 256 300)"><rect x="153" y="123" width="232" height="254" rx="54" fill="url(#cardMid)"/></g>
  <g transform="rotate(0 256 300)">
    <rect x="166" y="123" width="232" height="254" rx="54" fill="url(#cardFront)"/>
    <path fill="#08192a" d="M232 223 Q232 210 243.63 215.81 L300.37 244.19 Q312 250 300.37 255.81 L243.63 284.19 Q232 290 232 277 Z"/>
  </g>
</svg>
