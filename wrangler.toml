# RamdonLatam Canales — Cloudflare Worker para el addon de Stremio.
# Mantener el nombre estable: es el Worker del addon.
# La clave de cifrado no va en este archivo: configura un secret con
# `openssl rand -hex 32 | npx wrangler secret put M3U_PROXY_SECRET`.

name = "ramdonlatam"
main = "worker.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ADDON_NAME = "RamdonLatam Canales"
CACHE_TTL_SECONDS = "21600"

# Solo se conserva el logo requerido por el manifest del addon.
[assets]
directory = "./public"
run_worker_first = false
